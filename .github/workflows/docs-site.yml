name: Docs site

# Scaffold is the sole authority for docs.noisemaker.app deploys. This
# workflow just fires the workflow_dispatch at scaffold's
# static-site-release, which clones this repo at the pushed SHA, builds
# the Noisemaker bundles and the Sphinx HTML, writes
# deployment-meta.json, and rsyncs docs/_build/html/ to
# ~/sites/docs.noisemaker.app/content on nf-toronto.
#
# Keeping the SSH key + server IP on the scaffold side means this
# public repo carries no deploy secrets — only the EHSRE app private
# key, which is scoped to dispatching scaffold workflows.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/docs-site.yml'
      - '.readthedocs.yaml'
      - 'docs/**'
      - 'noisemaker/**'
      - 'pyproject.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/bundle.js'
      - 'scripts/bundle-shaders.js'
      - 'scripts/bundle-effects.js'
      - 'shaders/**'

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # js.yml does not watch docs/**, so a docs-only change would otherwise
  # reach production ungated. This is the gate: it runs on the same paths
  # that trigger the deploy, and the dispatch below waits on it.
  verify:
    name: Verify docs asset paths
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'

    # Node builtins only — no npm install needed.
    - name: Check _static references resolve at every page depth
      run: node --test test/docs-static-paths.test.js

  trigger-scaffold-release:
    name: Dispatch scaffold static-site-release
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Mint scaffold GitHub App token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: 2959521
        private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
        owner: noisefactorllc
        repositories: scaffold

    - name: Dispatch scaffold static-site-release for docs.noisemaker.app
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        gh workflow run static-site-release.yml \
          --repo noisefactorllc/scaffold \
          --ref main \
          -f site=noisemaker-docs \
          -f sha=${{ github.sha }}
        echo "Dispatched scaffold static-site-release for noisemaker-docs @ ${{ github.sha }}"
